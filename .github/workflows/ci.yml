name: Check app
on:
  push:
  pull_request:
permissions:
  contents: read
defaults:
  run:
    working-directory: tauri
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tauri/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libdbus-1-dev xdg-utils poppler-utils cups-client imagemagick libreoffice-writer
      - run: npm ci
      - run: npm run check
      - run: python3 ../scripts/check-site.py
      - run: bash -n ../scripts/install-app.sh ../scripts/install-release.sh ../scripts/install-local.sh
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo check --manifest-path src-tauri/Cargo.toml --locked
      - run: npm run tauri -- build --no-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: tauri/src-tauri/target/release/archjet
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-preview
          path: tauri/website/assets/workspace-preview.png

  desktop:
    needs: verify
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        desktop: [gnome, xfce]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-binary
          path: tauri/src-tauri/target/release
      - run: chmod +x src-tauri/target/release/archjet
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-0 libayatana-appindicator3-1 python3-gi gir1.2-atspi-2.0 at-spi2-core cups-client poppler-utils xvfb dbus-x11 imagemagick wmctrl gnome-shell xfce4
      - name: Native desktop smoke
        working-directory: .
        run: xvfb-run -a -s '-screen 0 1440x1000x24' dbus-run-session -- bash scripts/desktop-smoke.sh ${{ matrix.desktop }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-${{ matrix.desktop }}
          path: |
            desktop.png
            desktop.log
            app.log
            windows.log

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-binary
          path: release/stage
      - name: Package and publish
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp release/stage/archjet release/stage/archjet-linux-x86_64
          cp release/stage/archjet release/stage/print-arch-linux-x86_64
          cp tauri/src-tauri/icons/icon.png scripts/install-release.sh scripts/install-app.sh release/stage/
          cd release/stage
          sha256sum archjet-linux-x86_64 > archjet-linux-x86_64.sha256
          sha256sum print-arch-linux-x86_64 > print-arch-linux-x86_64.sha256
          gzip -9 -c archjet-linux-x86_64 > archjet-linux-x86_64.gz
          rm archjet
          gh release create "$GITHUB_REF_NAME" ./* --repo "$GITHUB_REPOSITORY" --title "ArchJet $GITHUB_REF_NAME" --notes-file ../../tauri/website/content/release-notes.md
