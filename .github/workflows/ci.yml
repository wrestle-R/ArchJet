name: Check app
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libdbus-1-dev xdg-utils poppler-utils cups-client imagemagick libreoffice-writer
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo check --manifest-path src-tauri/Cargo.toml --locked
      - run: npm run tauri -- build --no-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: src-tauri/target/release/print-arch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-preview
          path: docs/workspace-preview.png

  desktop:
    needs: verify
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        desktop: [gnome, xfce]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-binary
          path: src-tauri/target/release
      - run: chmod +x src-tauri/target/release/print-arch
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-0 libayatana-appindicator3-1 python3-gi gir1.2-atspi-2.0 at-spi2-core cups-client poppler-utils xvfb dbus-x11 imagemagick wmctrl gnome-shell xfce4
      - name: Native desktop smoke
        run: xvfb-run -a -s '-screen 0 1440x1000x24' dbus-run-session -- bash scripts/desktop-smoke.sh ${{ matrix.desktop }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-${{ matrix.desktop }}
          path: |
            desktop.png
            desktop.log
            app.log
            windows.log
